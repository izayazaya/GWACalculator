<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OCR Subject Code & Grade Extractor</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    textarea {
      width: 100%;
      height: 300px;
      font-family: monospace;
      font-size: 14px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Upload an Image to Extract Subject Codes and Grades</h2>
  <input type="file" id="imageInput" accept="image/*" />
  <textarea id="output" placeholder="Extracted subject codes and grades will appear here..."></textarea>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <script>
    const imageInput = document.getElementById('imageInput');
    const output = document.getElementById('output');

    // ✅ Your 7 known subject codes
    const knownCodes = [
      'CS103',
      'CS107',
      'GEC12',
      'GEC13',
      'MATH102',
      'NSTP12',
      'PATHFIT2'
    ];

    function clean(line) {
      return line.replace(/[^A-Za-z0-9]/g, '').toUpperCase(); // e.g., "CS 107" → "CS107"
    }

    function isGrade(line) {
      const cleaned = line.replace(/[^0-9.]/g, '');

      // Normalize grades
      if (/^[0-5](\.|:)?[05]$/.test(line)) {
        return cleaned.replace(':', '.');
      } else if (/^[0-5]0$/.test(cleaned)) {
        return cleaned[0] + '.0';
      } else if (/^[0-5]5$/.test(cleaned)) {
        return cleaned[0] + '.5';
      }

      return null;
    }

    function extractSubjectCodesAndGrades(rawText) {
    const lines = rawText.split('\n').map(line => line.trim()).filter(Boolean);
    const output = [];

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const next = lines[i + 1] || '';
        const cleanedLine = clean(line);

        for (const code of knownCodes) {
        if (cleanedLine.includes(code)) {
            const grade = isGrade(next);
            output.push(`${code} - ${grade || 'N/A'}`);
            break;
        }
        }
    }

    return output.join('\n');
    }


    imageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      output.value = 'Processing OCR... please wait.';
      const imageURL = URL.createObjectURL(file);

      try {
        const result = await Tesseract.recognize(imageURL, 'eng', {
          logger: m => console.log(m)
        });

        const rawText = result.data.text.trim();
        const extracted = extractSubjectCodesAndGrades(rawText);
        output.value = extracted || 'No valid subject codes or grades found.';
      } catch (err) {
        output.value = 'Error during OCR: ' + err.message;
        console.error(err);
      }
    });
  </script>
</body>
</html>
